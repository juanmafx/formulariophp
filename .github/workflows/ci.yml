name: CI

on:
  push:
    branches: [master, modernize/2026]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring, pdo_sqlite, sodium
          coverage: none
          tools: composer:2.9.5
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-scripts --no-interaction --no-progress --prefer-dist
      - run: composer audit --locked
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - run: vendor/bin/phpunit --no-progress
